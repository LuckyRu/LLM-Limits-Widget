name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test all projects
        shell: pwsh
        run: |
          $projects = @(
            'tests/LLMLimitsWidget.Domain.Tests/LLMLimitsWidget.Domain.Tests.csproj',
            'tests/LLMLimitsWidget.Application.Tests/LLMLimitsWidget.Application.Tests.csproj',
            'tests/LLMLimitsWidget.Provider.Codex.Tests/LLMLimitsWidget.Provider.Codex.Tests.csproj',
            'tests/LLMLimitsWidget.Provider.Claude.Tests/LLMLimitsWidget.Provider.Claude.Tests.csproj',
            'tests/LLMLimitsWidget.Infrastructure.Windows.Tests/LLMLimitsWidget.Infrastructure.Windows.Tests.csproj',
            'tests/LLMLimitsWidget.Presentation.Tests/LLMLimitsWidget.Presentation.Tests.csproj',
            'tests/LLMLimitsWidget.Architecture.Tests/LLMLimitsWidget.Architecture.Tests.csproj',
            'tests/LLMLimitsWidget.ClaudeStatusLineBridge.Tests/LLMLimitsWidget.ClaudeStatusLineBridge.Tests.csproj'
          )
          $projects | ForEach-Object { dotnet run --project $_ -p:UseSharedCompilation=false; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Publish self-contained build
        shell: pwsh
        run: .\scripts\publish-release.ps1 -Runtime win-x64 -OutputName win-x64-self-contained -SelfContained
      - name: Publish framework-dependent build
        shell: pwsh
        run: .\scripts\publish-release.ps1 -Runtime win-x64 -OutputName win-x64-framework-dependent
      - name: Download .NET Windows Desktop Runtime bootstrapper
        shell: pwsh
        run: |
          $runtimeDirectory = 'artifacts/runtime'
          New-Item -ItemType Directory -Path $runtimeDirectory -Force | Out-Null
          $runtimeInstaller = Join-Path $runtimeDirectory 'windowsdesktop-runtime-win-x64.exe'
          Invoke-WebRequest `
            -Uri 'https://aka.ms/dotnet/10.0/windowsdesktop-runtime-win-x64.exe' `
            -OutFile $runtimeInstaller
          if ((Get-Item -LiteralPath $runtimeInstaller).Length -lt 10MB) {
            throw '.NET Windows Desktop Runtime bootstrapper download looks invalid.'
          }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes
      - name: Build self-contained installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = $env:RELEASE_VERSION.TrimStart('v')
          & $iscc "/DMyAppVersion=$version" "/DPublishDir=$pwd\artifacts\publish\win-x64-self-contained" "/DInstallerSuffix=self-contained" "/DRequiresRuntime=0" packaging/LLMLimitsWidget.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build framework-dependent installer with runtime bootstrapper
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = $env:RELEASE_VERSION.TrimStart('v')
          & $iscc "/DMyAppVersion=$version" "/DPublishDir=$pwd\artifacts\publish\win-x64-framework-dependent" "/DInstallerSuffix=framework-dependent" "/DRequiresRuntime=1" "/DRuntimeInstallerPath=$pwd\artifacts\runtime\windowsdesktop-runtime-win-x64.exe" packaging/LLMLimitsWidget.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create portable ZIPs
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          Compress-Archive -Path artifacts/publish/win-x64-self-contained/* -DestinationPath "artifacts/LLM-Limits-Widget-$version-win-x64-self-contained.zip"
          Compress-Archive -Path artifacts/publish/win-x64-framework-dependent/* -DestinationPath "artifacts/LLM-Limits-Widget-$version-win-x64-framework-dependent.zip"
      - name: Generate product changelog
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: .\scripts\generate-product-changelog.ps1 -Version $env:RELEASE_VERSION
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $tag = "v$version"
          gh release create $tag artifacts/installer/*.exe artifacts/*.zip --title "LLM Limits Widget $tag" --notes-file artifacts/release-notes.md
